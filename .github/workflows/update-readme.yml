name: Update README with Images

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'imgs/**'
      - '*.m'
      - 'scripts/update_readme.py'
      - '.github/workflows/update-readme.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'imgs/**'
      - '*.m'
      - 'scripts/update_readme.py'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:

jobs:
  check-readme:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Update README visualization gallery
      run: python scripts/update_readme.py

    - name: Check README is up to date
      run: |
        if ! git diff --exit-code README.md; then
          echo "::error::README visualization gallery is out of date. Run python scripts/update_readme.py and commit README.md."
          exit 1
        fi

  update-readme:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Update README visualization gallery
      run: python scripts/update_readme.py

    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        git commit -m "Auto-update README visualization gallery"
        git push
